name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check EPG-Janitor tools tests

      # Every shipped module, found by pattern rather than named one at a time.
      # Only matching_core.py was ever compile checked here, so the other eight
      # shipped modules -- including plugin.py, which is Django coupled and so is
      # never imported by the test suite -- had no compile gate at all. A list
      # that must be edited whenever a module is added is a list that will be
      # forgotten, so this globs instead, and fails loudly if the glob is empty.
      # Ported from the sibling plugin Channel-Maparr, which hit exactly this.
      - name: Compile-check shipped plugin sources
        run: |
          shopt -s nullglob
          files=(EPG-Janitor/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "no plugin sources found"; exit 1; fi
          printf 'compiling %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"
        shell: bash

      # Explicit, named drift gate: freezes the pure matcher primitives against
      # tests/matcher_golden_baseline.json (Stage 0 of the matcher standardization
      # plan). -o addopts="" neutralizes inherited ini options (e.g. --cov) for a
      # clean single-file run with no coverage-threshold interference.
      - name: Matcher golden drift gate
        run: python -m pytest tests/test_matcher_golden.py -q -o addopts=""

      # The vendored shared matching core must stay byte-identical to its pinned
      # hash (catches a stray hand-edit to the vendored copy or a CRLF checkout).
      # Its byte-compile now happens in the glob step above, with every other
      # shipped module.
      - name: Vendored-core parity gate
        run: python -m pytest tests/test_core_parity.py -q -o addopts=""

      - name: Run tests with coverage
        run: python -m pytest tests --cov --cov-report=term-missing

      # Guards against backslash-separator release zips (Stream-Mapparr bug-087):
      # validates any committed release zip; no-op when none is checked in.
      - name: Validate committed release zip(s)
        run: |
          shopt -s globstar nullglob
          zips=(**/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No committed release zip — skipping."; exit 0; fi
          rc=0
          for z in "${zips[@]}"; do
            echo "::group::$z"; python scripts/validate_zip.py "$z" || rc=1; echo "::endgroup::"
          done
          exit $rc
